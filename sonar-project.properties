# SonarQube / SonarCloud Project Configuration
sonar.organization=ikramullahrumi
sonar.projectKey=ikramullahrumi_cohort-9-mern-9387-muhammad
sonar.projectName=cohort-9-mern-9387-muhammad
sonar.projectVersion=1.0.0

# Source & Test Directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src/tests,frontend/src/components/tests,frontend/src/pages/tests,frontend/src/hooks/tests,frontend/src/services/tests,frontend/src/utils/tests

# Inclusions & Exclusions
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/vite.config.ts,**/vitest.config.ts,**/setup.ts,sonar-project.properties

# Coverage Exclusions for non-testable application bootstrap/entry files
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/App.tsx,frontend/src/services/socket.ts,backend/src/server.ts,backend/src/config/database.ts,backend/src/config/socket.ts

# Test Inclusions
sonar.test.inclusions=backend/src/tests/**/*.ts,frontend/src/**/tests/**/*.tsx,frontend/src/**/tests/**/*.ts

# Test Coverage Reports (LCOV format generated by Vitest)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
