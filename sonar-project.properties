# SonarQube / SonarCloud Project Configuration
sonar.organization=ikramullahrumi
sonar.projectKey=ikramullahrumi_cohort-9-mern-9387-muhammad
sonar.projectName=cohort-9-mern-9387-muhammad
sonar.projectVersion=1.0.0

# Source & Test Directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src/tests,frontend/src

# Inclusions & Exclusions
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/vite.config.ts,**/vitest.config.ts,**/setup.ts,sonar-project.properties

# Test Inclusions
sonar.test.inclusions=backend/src/tests/**/*.ts,frontend/src/**/tests/**/*.tsx,frontend/src/**/tests/**/*.ts

# Test Coverage Reports (LCOV format generated by Vitest)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
